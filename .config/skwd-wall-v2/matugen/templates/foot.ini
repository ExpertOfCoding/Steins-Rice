[colors-dark]
alpha=1.0
foreground={{colors.on_background.default.hex_stripped}}
background={{colors.surface.default.hex_stripped}}
selection-foreground={{colors.on_primary.default.hex_stripped}}
selection-background={{colors.primary.default.hex_stripped}}
cursor={{colors.on_primary.default.hex_stripped}} {{colors.primary.default.hex_stripped}}

regular0={{colors.surface.default.hex_stripped}}
regular1={{colors.ansi_red.default.hex_stripped}}
regular2={{colors.ansi_green.default.hex_stripped}}
regular3={{colors.ansi_yellow.default.hex_stripped}}
regular4={{colors.ansi_blue.default.hex_stripped}}
regular5={{colors.ansi_magenta.default.hex_stripped}}
regular6={{colors.ansi_cyan.default.hex_stripped}}
regular7={{colors.on_surface.default.hex_stripped}}

bright0={{colors.outline.default.hex_stripped}}
bright1={{colors.ansi_red_bright.default.hex_stripped}}
bright2={{colors.ansi_green_bright.default.hex_stripped}}
bright3={{colors.ansi_yellow_bright.default.hex_stripped}}
bright4={{colors.ansi_blue_bright.default.hex_stripped}}
bright5={{colors.ansi_magenta_bright.default.hex_stripped}}
bright6={{colors.ansi_cyan_bright.default.hex_stripped}}
bright7={{colors.on_background.default.hex_stripped}}

# Foot keeps dark and light palettes in memory. Both sections intentionally
# carry the active Skwd palette, so a desktop colour-mode signal cannot switch
# a running terminal back to stale defaults.
[colors-light]
alpha=1.0
foreground={{colors.on_background.default.hex_stripped}}
background={{colors.surface.default.hex_stripped}}
selection-foreground={{colors.on_primary.default.hex_stripped}}
selection-background={{colors.primary.default.hex_stripped}}
cursor={{colors.on_primary.default.hex_stripped}} {{colors.primary.default.hex_stripped}}

regular0={{colors.surface.default.hex_stripped}}
regular1={{colors.ansi_red.default.hex_stripped}}
regular2={{colors.ansi_green.default.hex_stripped}}
regular3={{colors.ansi_yellow.default.hex_stripped}}
regular4={{colors.ansi_blue.default.hex_stripped}}
regular5={{colors.ansi_magenta.default.hex_stripped}}
regular6={{colors.ansi_cyan.default.hex_stripped}}
regular7={{colors.on_surface.default.hex_stripped}}

