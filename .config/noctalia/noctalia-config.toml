sound_volume = 0.61999998614192009

[backdrop]
enabled = true
tint_intensity = 0.0

[bar.default]
background_opacity = 0.29999999329447746
capsule_fill = "surface"
capsule_opacity = 0.62
center = [ "group:g3" ]
